# Test build of the stagger-gauge branch: an MSI to try before a PR.
# Not for upstream. Download it under Actions -> this run -> Artifacts.
name: Test build (MSI)

on:
  push:
    branches: [build-test]
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - run: npm run rename-msi
      - uses: actions/upload-artifact@v4
        with:
          name: A2Tools-DPS-Meter-stagger-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
